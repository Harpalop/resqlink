spring:
  application:
    name: resqlink-api

  datasource:
    url: ${DB_URL:jdbc:h2:mem:resqlink;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

server:
  port: 8080


resqlink:
  security:
    jwt:
      # Dev-only secret. Override with the JWT_SECRET environment variable in production.
      secret: ${JWT_SECRET:jrchwVcycyL39QUDXBcSMFXKupKGGGvb7DZDJNux3KPdr4QO1iWFf0fhy05m12i5EjI+DpMCdIEP8Uciltu7mw==}
      access-token-ttl-ms: 86400000    # 24 hours
      refresh-token-ttl-ms: 604800000  # 7 days
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    vapid:
      public-key: ${VAPID_PUBLIC_KEY:BPE_JUtjE9nbGeDtKmLda_F2rNMQio9PeH1bvisstkPCEu3lMIhNUAHfoVnrQTUQwv8UFnKnyRNsbUmCDFLLCm4}
      private-key: ${VAPID_PRIVATE_KEY:V3YfLwQyJdaS95izrjNMZhzOHfUPe4WaEM_sDHgcl7c}

logging:
  level:
    org.springframework.security: INFO
